name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only GITHUB_TOKEN: nothing here writes to the repo, and the default
# permissions depend on org/repo settings rather than on this file.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a mutable tag like @v4 lets an
      # upstream retag change what runs in CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Standard library only — no install step needed.
      - name: Validate skill and eval suite
        run: python3 scripts/validate_skill.py

      - name: Validate against upload rules
        run: python3 scripts/validate_skill.py --for-upload

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      # Runtime behavior is covered by TestInstaller in the suite above; these
      # catch syntax and quoting problems on paths the tests do not reach.
      - name: Lint installer
        run: |
          test -x install.sh || { echo "install.sh is not executable"; exit 1; }
          bash -n install.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck install.sh
          else
            echo "shellcheck unavailable on this runner, skipped"
          fi

      # The archive is byte-reproducible, so rebuilding must be a no-op.
      # A diff here means the committed .skill is stale relative to SKILL.md.
      - name: Check committed .skill artifact is up to date
        run: |
          python3 scripts/package_skill.py --quiet
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/delegate.skill is stale — run 'python3 scripts/package_skill.py' and commit the result"
            exit 1
          fi
